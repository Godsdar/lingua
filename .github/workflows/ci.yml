name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build desktop
        run: npm run build

      - name: Build extension
        run: npm run build:ext

      - name: Build web
        run: npm run build:web

      - uses: actions/upload-artifact@v4
        with:
          name: lingua-desktop
          path: out

      - uses: actions/upload-artifact@v4
        with:
          name: lingua-extension
          path: extension/dist

      - uses: actions/upload-artifact@v4
        with:
          name: lingua-web
          path: web/dist
